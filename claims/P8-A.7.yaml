statement: For the unchanged A.5/A.6 massless minimal Hadamard preparation, the actual
  Wick square equals an explicit retarded Born functional on the exact finite metric
  plus an all-frequency nonlinear mode remainder with two actual-conformal-time derivatives.
  Keeping identical exact anomaly, length/finite prescription and past density gives
  exact full density, pressure and EED error identities, including a required history
  integral. Derived rational potential jets through order five and cutoff jets through
  seven certify 0<=delta<=2048/190897521, delta=4*epsilon*d/t_star^2, and explicit
  quadratic finite-amplitude error constants. At delta=10^-12 all three errors are
  below 1% of the corresponding positive A.3 reference component at the same proper
  time on 2<=y<=3. The Born functional is not asserted to be a positive state; no
  finite error for a different metric family, exact/stable SEE solution, perturbed
  all-sampler QSEI or cosmological focusing theorem follows
