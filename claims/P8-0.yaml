statement: 'S0 source-level identities only: on the nonzero-mode, a>0, Theta≠0 chart
  of the transcribed KYY11 (4.24) action, constraint elimination and explicit IBP
  give G_S = Sigma G_T²/Theta² + 3G_T and F_S = a⁻¹ d(a G_T²/Theta)/dt − F_T, with
  no generic 1/H pole. For the transcribed A25 coupled matrices, rolling luminal matter
  gives det(K−G) = −Y Q²(f−g)²; using MRV20 (8a) for D recovers the exceptional relation,
  whereas printed A25 (10g) has the recorded nonzero discrepancy. The prescribed A25
  benchmark has the exact local bounce/regularized-a1 jets recorded in the certificate,
  including Hdot(0)=1/375. No covariant reduction, global no-go, complete stable bounce,
  or ladder verdict is established'
