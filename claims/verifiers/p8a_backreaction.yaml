- tools/empiricist_check.py
- problems/P8/a/src
- problems/P8/a/applicability/src
- problems/P8/a/applicability/reference/src
- problems/P8/a/applicability/reference/asymptotics/src
- problems/P8/a/applicability/reference/asymptotics/backreaction/src
