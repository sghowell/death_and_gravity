name: p8a_remainder
version: "1"
argv:
  - .venv/bin/python
  - tools/empiricist_check.py
  - p8a_remainder
  - "{evidence}"
cwd: .
env:
  PYTHONPATH: "problems/P8/a/src:problems/P8/a/applicability/src:problems/P8/a/applicability/reference/src:problems/P8/a/applicability/reference/asymptotics/src:problems/P8/a/applicability/reference/asymptotics/backreaction/src:problems/P8/a/applicability/reference/asymptotics/backreaction/response/src:problems/P8/a/applicability/reference/asymptotics/backreaction/response/remainder/src"
inputs:
  - tools/empiricist_check.py
  - problems/P8/a/src
  - problems/P8/a/applicability/src
  - problems/P8/a/applicability/reference/src
  - problems/P8/a/applicability/reference/asymptotics/src
  - problems/P8/a/applicability/reference/asymptotics/backreaction/src
  - problems/P8/a/applicability/reference/asymptotics/backreaction/response/src
  - problems/P8/a/applicability/reference/asymptotics/backreaction/response/remainder/src
fixtures:
  pass:
    - problems/P8/a/applicability/reference/asymptotics/backreaction/response/remainder/certificates/radiation-remainder.json
  fail:
    - claims/fixtures/p8a_remainder/fail-mutated-status.json
timeout_s: 1800
