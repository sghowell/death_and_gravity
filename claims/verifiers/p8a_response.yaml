name: p8a_response
version: '1'
argv:
- .venv/bin/python
- tools/empiricist_check.py
- p8a_response
- '{evidence}'
cwd: .
env:
  PYTHONPATH: problems/P8/a/src:problems/P8/a/applicability/src:problems/P8/a/applicability/reference/src:problems/P8/a/applicability/reference/asymptotics/src:problems/P8/a/applicability/reference/asymptotics/backreaction/src:problems/P8/a/applicability/reference/asymptotics/backreaction/response/src
inputs:
- tools/empiricist_check.py
- problems/P8/a/src
- problems/P8/a/applicability/src
- problems/P8/a/applicability/reference/src
- problems/P8/a/applicability/reference/asymptotics/src
- problems/P8/a/applicability/reference/asymptotics/backreaction/src
- problems/P8/a/applicability/reference/asymptotics/backreaction/response/src
fixtures:
  pass:
  - problems/P8/a/applicability/reference/asymptotics/backreaction/response/certificates/radiation-response.json
  fail:
  - claims/fixtures/p8a_response/fail-mutated.json
fail_exit_codes:
- 3
timeout_s: 1800
