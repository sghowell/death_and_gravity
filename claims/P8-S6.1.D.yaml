statement: An explicit smooth D-only extension agrees with the full pinned action
  on an open set containing its entire clock tube and has a constant-clock Minkowski
  vacuum with healthy massive scalar quadratic action and arbitrary coefficient lambda
  of ((partial psi)^2)^2. Independent vacuum plane-wave expansion gives b2=4 lambda,
  so the tube does not fix even this leading scalar positivity diagnostic. Recomputing
  the Ia dependents preserves their identities and nonzero denominator. Under the
  separate stronger requirement of connected global real coefficient analyticity plus
  exact open-tube equality, the identity theorem and pinned F(phi,0)<0 instead exclude
  a finite constant-clock Minkowski vacuum for this specific witness. Neither statement
  proves controlled vacuum-to-bounce matching, finite-gravity positivity, UV completion
  or a row exclusion
