  background equations. Local background units compactify both tails, give a uniformly
  nonzero normalized lapse Hessian, bounded covering principal kinetic charts and
  explicit uniform bounds for all 34 invariant coefficients. This is local algebraic
  lapse reduction, not fully momentum-reduced physical vertices, nonlinear stability,
  a cutoff hierarchy or UV completion
