statement: For A.5's past-prepared massless minimal Hadamard family, the actual first
  parameter derivative of the Wick square and physical density, pressure and EED is
  an explicit retarded logarithmic kernel plus local terms in the named GS-H_lambda,gamma
  prescription. The unchanged past fixes the radiation integration constant; proper-time
  conversion and finite curvature/scale freedom are retained. Exact rational derivative
  bounds are derived for a specified C-infinity preparation, not supplied as synthetic
  response inputs. They bound the actual second-order Einstein-defect coefficients.
  A smooth second-order metric correction constructed from the density coefficient
  cancels both physical components and gives a qualitative compact-slab actual residual
  O(epsilon^3). No finite-amplitude remainder bound, exact/stable SEE solution, perturbed
  all-sampler QSEI or cosmological focusing theorem is established
