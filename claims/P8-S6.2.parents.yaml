statement: Stable stationary elimination of affine-X heavy scalars gives P_XX>=0,
  whereas the pinned tube has F_XX<0 at every finite time and F_XX(0,1)=-10M^2/tau^2,
  requiring a second-jet matching remainder at least as large as that target jet in
  the stated coefficient convention. A classical minimal Einstein/positive-field-metric
  parent cannot realize the physical bounce and needs a null-stress discrepancy at
  least 4M^2/tau^2. For a nonminimal Q(Phi)R parent with positive Einstein-frame field
  metric, q=Q/M^2 must satisfy 4q0+q2-3q1^2/(2q0)<=0 at the exact bounce; simultaneous
  normalized errors in q0 from 1 and in its first two physical-time jets therefore
  require epsilon>=4/7. This is a necessary condition, not a construction. An exact
  nonminimal background control escapes with jets (1,0,-6) but has Q->0 tails and
  is not an accepted P8 witness. These are scoped matching obstructions, not a DHOST
  positivity condition, general UV no-go, whole-row exclusion or proof that the splice
  has no parent
