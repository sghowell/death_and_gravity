statement: For the frozen massless minimal reference, Einstein gravity plus conserved
  classical radiation with fixed normalization and time origin gives a/a0=1-epsilon*d/t^2+O(epsilon^2),
  d=kappa*hbar/(46080*pi^2). A specified conserved order-reduced fluid has exact a_OR^4=4*A^2*(t^2-4*epsilon*d);
  rational bounds control its Taylor remainder and frozen-reference Einstein defects
  for 0<=4*epsilon*d/t^2<=1/4. Smooth temporal preparation and retarded Hadamard-state
  transport give an actual compact-slab SEE residual O(epsilon^2), with no computed
  response constant. Independent order-zero curvature-squared couplings are excluded;
  loop-order ones enter the residual. The surrogate is not an exact quantum source
  or unique higher-order completion. No nearby exact SEE solution, physical epsilon=1
  error, transferred QSEI constant or new incompleteness theorem is established
