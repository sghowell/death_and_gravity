statement: In the frozen small-field auxiliary-metric spatial gauge, all three matter-sourced
  momentum constraints are recursively solved through degree three, giving cubic/quartic
  phase kernels for arbitrary nonexceptional rational spatial momenta and rational
  TT polarizations. Both mixed scalar-matter canonical shifts, full density/curvature
  geometry and time generators are retained. The full symbolic-time quadratic action
  is recovered in ordinary and gamma phase charts. Fixed-momentum phase coefficients
  are compact-time bounded by finite algebraic closure with J>1/10; no expanded symbolic
  quartic majorant is claimed. In admitted velocity charts, unnormalized quartic kernels
  include the full two-scalar inverse-Hessian contact and both TT polarizations. The
  gamma positive velocity condition is q*Lambda^2>J+w^2/2, not the D-only condition;
  the finite-q matter kinetic diagonal is generally not 1/2. Coupled mode normalization,
  propagation bounds, M1 interaction control, loops and UV remain open
