statement: For every state with a microlocal Hadamard two-point distribution of the
  specified free massless minimal scalar on the entire radiation patch (0,infinity)_eta
  times R3, the smooth rescaled state difference extends as a flat bisolution through
  eta=0. No quasifree, homogeneity, decay, finite-energy or extra higher-point regularity
  assumption is needed. State-dependent EED is O(eta^-6), while A.3 gives lim t^4*E_omega=hbar/(5120*pi^2)>0,
  locally uniformly in space for each fixed state. The exact-radiation SEE with finite
  constant gravitational couplings and only additional ordinary traceless radiation
  requires this limit to vanish, so no admitted state solves that whole-patch ansatz.
  The theorem does not exclude finite slabs, nearby backreacted metrics, other fields
  or arbitrary traceful extra sources, and gives no state-uniform onset time or new
  incompleteness theorem
