statement: For positive-definite K=[[A,B],[B,Q]] and G=[[C,D],[D,Q]] with Q>0, define
  k=A-B^2/Q, a=A-C, b=B-D, s=(a-2Bb/Q)/k and r^2=b^2/(kQ). Exact squared speeds are
  1-s/2 plus or minus sqrt(s^2/4+r^2); healthy causal scalar modes are equivalent
  to b=0 and 0<=a<k. Any nonzero mismatch b forces c_plus^2>1 regardless of the gravitational
  diagonal buffer. Crossing-safe CD invariants recover the covariant exceptional relation.
  The explicit deformation delta_F=epsilon*J_star(phi)*(X-1)^2/(4d^2) preserves the
  pinned background/tube/tails and gives speeds squared {1,1/(1+epsilon/d^2)}, healthy
  and causal for fixed finite epsilon>=0. This is a principal matrix theorem and a
  one-sided covariant family, not a radiative-correction computation, mismatch margin,
  finite-k result or technical-naturalness/UV verdict
