  fit residual 4.9e−3 in ln|E|; the earlier p ≈ 0.7 real-ray reading was the d/κ correction
  aliasing into the power on |κ| ≤ 60); factorisation C = c_s D_∞ e^{−J} κ^{−1} with
  D_∞ = 2.0389 (κ-free centre determinant) and J(δ*=0.05) = 6.274 in the stated Levinson
  frame'
