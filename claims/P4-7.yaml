statement: 'Structure of E at large |κ| in the closed right half-plane: E(κ) = C κ^{−q}
  e^{Φ₊κ}(1 + d/κ + O(1/κ²)) with Φ₊ = 0.86161 (= ∫μ₊dx), q = 0.997 ≈ 1, C = 0.6326,
