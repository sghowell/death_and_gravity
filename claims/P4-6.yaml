statement: 'Theorem B (mode count in the rectangle): for the linearized EC problem
  in the KHA sonic-point gauge, the matching function E (zeros = analytic-at-sonic-point,
  regular-centre perturbations) is analytic on a neighbourhood of R = [0,15]×[−14,14]
  and has exactly two zeros there, both simple and real: the pure-gauge zero κ̄ ∈
  [0.35569919907, 0.35569920835] (= 2 − A₀ + 2ω₀/3, generator verified) and κ₁ ∈ [2.81055254439,
  2.81055255326]; hence exactly one non-gauge eigenvalue with Re κ ≥ 0 in R and γ
  = 1/κ₁ ∈ [0.3558019218, 0.3558019231]'
