statement: Pulling back an Einstein/NEC-scalar parent gives G_T/M^2=C^(3/2)/sqrt(W),
  F_T/M^2=sqrt(CW). Positive constant tensor tails and a growing in both tails would
  force its log(a_E) to violate concavity, excluding every regular map in this parent
  class regardless of large finite frame derivatives. For the exact D geometry, common
  tensor-value error at t=(-L*tau,0,L*tau) necessarily exceeds or equals (((1+L^2)^2-1)/((1+L^2)^2+1));
  equality is not a construction. Separately, every smooth invertible one-clock disformal
  map of the exact open D tube to quartic Horndeski must have J_map/C=1-2/(1+u^2)^3
  on X=1, so loses invertibility at u=+-sqrt(2^(1/3)-1). This failed map is not a
  pathology in the original witness; S5's spatial-only map remains regular. Neither
  result excludes general additional-field/operator, tube-deforming or quantum matching
  mechanisms or closes P8
