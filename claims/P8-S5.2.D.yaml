statement: In the small-field auxiliary-metric spatial gauge, all three momentum constraints
  are recursively solved through third order, yielding canonical cubic/quartic scalar
  and both-polarization tensor kernels for arbitrary nonexceptional rational spatial
  momenta and TT polarizations. The full geometry, canonical time boundaries, kinetic-normalization
  derivatives and scalar/tensor quartic Legendre correction are retained. Exact quadratic
  bridges, generic construction lemmas and replay fixtures support the reduction;
  14 fixed-momentum symbolic phase kernels have explicit all-time bounds. Zero-mode/forward
  limits, physical cubic exchange, on-shell amplitudes, a cutoff hierarchy, nonlinear
  stability and UV completion remain unestablished
