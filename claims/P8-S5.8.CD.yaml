statement: On abs(t-t0)<=ell0/100 at every finite center, external initial physical
  momenta in ell0 units lie in [10^11,10^12] and every nonempty proper signed subset
  has norm at least 10^11. Exact coupled free canonical columns, the full momentum
  boundary and both matter shifts yield explicit seed bounds. A positive degree-four
  recurrence includes all matter-sourced York orders and all 58 stationary Hamiltonian
  invariant records. Fixed-total-momentum continuum Schur estimates give norm<=1/1000
  for connected cubic 1-to-2/2-to-1 and hard quartic-order 2-to-2 blocks, retaining
  H4 and two H3 insertions with both scalar and both TT internal columns, for the
  uniform sufficient choice M*tau=10^324. This very conservative finite-order scale
  is not a realistic or optimized cutoff, global-vacuum prescription, inclusive/soft/forward
  bound, higher-order/loop estimate, nonlinear stability or UV-completion verdict
