statement: On a=A*eta, eta>0, the exact field map chi=a*phi constructs a reference
  Hadamard state. The positive-type difference QSEI for any Hadamard state and real
  compact positive-proper-time H2_0 sampling has Q=hbar/(16*pi^2) times the integral
  of hddot^2-3*hdot^2/(8*t^2)+105*h^2/(256*t^4). Positive-form and weighted-Hardy
  identities give 0<=Q<=hbar*norm(hddot)^2/(16*pi^2) with no assumed short averaging
  duration in this testbed. The absolute bound retains the actual reference EED; a
  supplied lower bound E_ref>=-beta*hbar/(16*pi^2*t^4) gives the stated conditional
  duration multiplier, but beta is not derived. Reference stress, SEE self-consistency,
  general-background/geodesic coverage and full P8(a) remain open
