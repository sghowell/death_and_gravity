statement: The regular spatial map h_ij=T^(-1/2) hat_h_ij, T=1+(N^-2-1)/d^3, removes
  lapse derivatives after retaining the additional local canonical primitive required
  by F2_phi. A full seven-velocity metric/matter Legendre transform recovers the prior
  Theta, Lambda, J and matter-mixing coefficients; omitting the primitive gives J-bridge
  error 18 at the bounce. Stationary lapse elimination reaches third order and the
  Hamiltonian fourth invariant order, with exact all-time 1/10<dJ<8 and explicit uniform
  bounds for all 85 recorded lapse/Hamiltonian invariant coefficients in fixed local
  background units. The matter-sourced spatial constraints, physical vertices, interaction
  window, loops and UV remain open
