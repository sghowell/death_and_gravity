statement: 'Classification conjecture after S2: every ladder row except {α_K} admits
  a stable crossing, so the minimal sets are exactly the four two-operator rows {α_K,α_B},
  {α_K,α_T}, {α_K,α_M}, {α_K,α_H} — refuting the folklore that braiding is the unique
  single-field rescue. Evidence: float near-witnesses on F* for all 7 no-braiding
  E-candidate rows (α_K = 1; e.g. {K,T}: α_T = −1/10, min c_s² = 0.076, c_T² = 0.9;
  {K,M}: α_M = 1/2 on J = [0.6,1], min c_s² = 0.304; {K,H}: α_H = 1, min c_s² = 0.280;
  all D2/D3 checks pass), the S1 KGB reproduction for {α_K,α_B}, and the exact combined-row
  offset/inheritance identities'
