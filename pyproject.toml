[project]
name = "death-and-gravity"
version = "0.0.1"
description = "AI-assisted attack on open problems in theoretical cosmology: certificate-gated computations"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "cvxpy>=1.5",
    "clarabel>=0.9",
    "scs>=3.2",
    "python-flint>=0.7",
    "mpmath>=1.3",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "sympy>=1.14.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["problems/P9/src"]
testpaths = ["problems/P9/tests"]
